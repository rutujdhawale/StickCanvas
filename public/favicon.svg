<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <filter id="stickerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Layer 1: Top-Left White Sticker Card -->
  <rect
    x="3"
    y="3"
    width="16"
    height="16"
    rx="3"
    fill="#FFFFFF"
    stroke="#171717"
    stroke-width="2.2"
    filter="url(#stickerShadow)"
  />

  <!-- Layer 2: Middle Paper-Cream Sticker Card -->
  <rect
    x="8"
    y="8"
    width="16"
    height="16"
    rx="3"
    fill="#FAF9F5"
    stroke="#171717"
    stroke-width="2.2"
    filter="url(#stickerShadow)"
  />

  <!-- Layer 3: Foreground Tomato Accent Sticker Card -->
  <rect
    x="13"
    y="13"
    width="16"
    height="16"
    rx="3"
    fill="#FF5A36"
    stroke="#FF5A36"
    stroke-width="2.2"
    filter="url(#stickerShadow)"
  />
</svg>
